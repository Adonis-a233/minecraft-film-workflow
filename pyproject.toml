[project]
name = "minecraft-film-agent"
version = "0.1.0"
description = "Deterministic planning and execution boundary for the Minecraft Film Project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jsonschema>=4.21,<5",
    "mcp>=2,<3",
    "nbtlib>=2.0.4,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
minecraft-film-agent = "minecraft_film_agent.cli:main"
minecraft-film-mcp = "minecraft_film_agent.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/src/minecraft_film_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["agent/tests"]

